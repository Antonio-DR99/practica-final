<div class="calculator">
  <div class="display">{{ display || '0' }}</div>
  <div class="buttons">
    <button (click)="press('C')" class="btn clear">C</button>
    <button (click)="press('DEL')" class="btn delete">DEL</button>
    <button (click)="press('/')" class="btn operator">/</button>
    <button (click)="press('*')" class="btn operator">*</button>
    
    <button (click)="press('7')" class="btn">7</button>
    <button (click)="press('8')" class="btn">8</button>
    <button (click)="press('9')" class="btn">9</button>
    <button (click)="press('-')" class="btn operator">-</button>
    
    <button (click)="press('4')" class="btn">4</button>
    <button (click)="press('5')" class="btn">5</button>
    <button (click)="press('6')" class="btn">6</button>
    <button (click)="press('+')" class="btn operator">+</button>
    
    <button (click)="press('1')" class="btn">1</button>
    <button (click)="press('2')" class="btn">2</button>
    <button (click)="press('3')" class="btn">3</button>
    <button (click)="press('.')" class="btn operator">.</button>
    
    <button (click)="press('0')" class="btn zero">0</button>
    <button (click)="press('=')" class="btn equals">=</button>
  </div>
</div>
