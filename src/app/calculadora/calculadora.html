<div class="calculator">
  <div class="display">{{ display || '0' }}</div>
  <div class="buttons">
    <!-- Primera fila: Control -->
    <button (click)="press('C')" class="btn btn-clear">C</button>
    <button (click)="press('DEL')" class="btn btn-delete">DEL</button>
    <button (click)="press('/')" class="btn btn-operator">/</button>
    <button (click)="press('*')" class="btn btn-operator">×</button>

    <!-- Segunda fila: 7, 8, 9 -->
    <button (click)="press('7')" class="btn btn-number">7</button>
    <button (click)="press('8')" class="btn btn-number">8</button>
    <button (click)="press('9')" class="btn btn-number">9</button>
    <button (click)="press('-')" class="btn btn-operator">−</button>

    <!-- Tercera fila: 4, 5, 6 -->
    <button (click)="press('4')" class="btn btn-number">4</button>
    <button (click)="press('5')" class="btn btn-number">5</button>
    <button (click)="press('6')" class="btn btn-number">6</button>
    <button (click)="press('+')" class="btn btn-operator">+</button>

    <!-- Cuarta fila: 1, 2, 3 -->
    <button (click)="press('1')" class="btn btn-number">1</button>
    <button (click)="press('2')" class="btn btn-number">2</button>
    <button (click)="press('3')" class="btn btn-number">3</button>
    <button (click)="press('=')" class="btn btn-equals">=</button>

    <!-- Quinta fila: 0, punto -->
    <button (click)="press('0')" class="btn btn-number btn-zero">0</button>
    <button (click)="press('.')" class="btn btn-number">.</button>
  </div>
</div>
